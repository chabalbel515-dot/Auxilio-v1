<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <style>
        /* Ajuste de centralização total e fundo */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            width: 100vw;
            margin: 0;
            overflow: hidden;
        }

        /* Card principal ocupando espaço vertical corretamente */
        .card { 
            background: rgba(10, 10, 10, 0.98); 
            border: 1px solid #1a1a1a; 
            border-radius: 30px; 
            padding: 20px; 
            width: 90%; 
            max-width: 360px; 
            text-align: center; 
            box-shadow: 0 0 40px rgba(255, 123, 0, 0.05);
        }

        .profile-img { width: 85px; height: 85px; border-radius: 50%; border: 2px solid #ff7b00; margin-bottom: 15px; }

        h2 { font-size: 18px; margin-bottom: 25px; letter-spacing: 2px; color: #fff; font-weight: bold; text-transform: uppercase; }

        /* LISTA VERTICAL - Isso corrige o bug da imagem 1 */
        .options-container {
            display: flex;
            flex-direction: column; /* Força um embaixo do outro */
            gap: 12px;
            margin-bottom: 20px;
        }

        .option { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #0a0a0a; 
            padding: 15px; 
            border-radius: 18px; 
            border: 1px solid #1a1a1a; 
            text-align: left;
        }

        /* Ícone laranja lateral */
        .icon-box {
            width: 45px;
            height: 45px;
            background: #ff7b00;
            border-radius: 12px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .option-info { flex-grow: 1; }
        .option-info strong { font-size: 14px; display: block; color: #fff; }
        .option-info span { font-size: 11px; color: #666; }

        /* Switch Estilizado */
        .switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { 
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; 
            background: #333; border-radius: 34px; transition: .3s; 
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .3s;
        }
        input:checked + .slider { background: #ff7b00; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Botão principal */
        .btn { 
            width: 100%; 
            padding: 18px; 
            background: #ff7b00; 
            border: none; 
            border-radius: 20px; 
            color: #fff; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-size: 13px;
            margin-top: 10px;
        }

        .hidden { display: none !important; }
        .footer-name { color: #444; font-size: 12px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <img src="1000053165.jpg" class="profile-img">
        <p style="margin-bottom: 10px;">coloca a key de acesso</p>
        <input type="password" id="key-input" style="width: 100%; padding: 12px; background: #111; border: 1px solid #333; border-radius: 10px; color: #fff; margin-bottom: 15px;" placeholder="insira a key...">
        <button class="btn" onclick="checkKey()">logar</button>
    </div>

    <div id="panel-screen" class="card hidden">
        <h2>PAINEL SIELZADA V3</h2>
        
        <div class="options-container">
            <div class="option">
                <div class="icon-box">🎯</div>
                <div class="option-info">
                    <strong>aimbot legit</strong>
                    <span>Melhora o alinhamento da mira.</span>
                </div>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>

            <div class="option">
                <div class="icon-box">⚙️</div>
                <div class="option-info">
                    <strong>reduzir lags</strong>
                    <span>Remove os lags do jogo.</span>
                </div>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>

            <div class="option">
                <div class="icon-box">📱</div>
                <div class="option-info">
                    <strong>melhorar 2x</strong>
                    <span>Melhora sua mira 2x em ate 10%.</span>
                </div>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>

            <div class="option">
                <div class="icon-box">⚡</div>
                <div class="option-info">
                    <strong>aumentar desempenho</strong>
                    <span>Otimização máxima de FPS.</span>
                </div>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
        </div>

        <button class="btn" onclick="openFreeFire()">ABRIR FREE FIRE</button>
        <div class="footer-name">sielz</div>
    </div>

    <script src="engine.js"></script>
    <script>
        // Função para testar a troca de tela (seu engine.js deve tratar isso)
        function checkKey() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('panel-screen').classList.remove('hidden');
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    </script>
</body>
</html>
