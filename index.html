<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <style>
        /* Reset básico para evitar espaços indesejados */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            /* Centralização Total */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            width: 100vw;
            overflow: hidden; 
        }

        .card { 
            background: rgba(15, 15, 15, 0.95); 
            border: 1px solid #222; 
            border-radius: 25px; 
            padding: 25px; 
            width: 90%; /* Responsivo para celulares */
            max-width: 340px; 
            text-align: center; 
            box-shadow: 0 10px 40px rgba(255, 123, 0, 0.15);
            /* Garante que o card seja tratado como bloco único no flex */
            flex-shrink: 0; 
        }

        .profile-img { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            border: 2px solid #ff7b00; 
            margin: 0 auto 15px auto; 
            display: block;
            object-fit: cover;
        }

        input[type="password"] { 
            width: 100%; 
            padding: 14px; 
            background: #111; 
            border: 1px solid #333; 
            border-radius: 12px; 
            color: #fff; 
            margin: 15px 0; 
            outline: none;
        }

        .btn { 
            width: 100%; 
            padding: 15px; 
            background: #ff7b00; 
            border: none; 
            border-radius: 12px; 
            color: #fff; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
            transition: transform 0.2s;
        }

        .btn:active { transform: scale(0.98); }

        .option { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #080808; 
            padding: 12px; 
            border-radius: 15px; 
            margin-bottom: 12px; 
            text-align: left; 
            border: 1px solid #1a1a1a; 
        }

        .option strong { font-size: 14px; display: block; color: #eee; }
        .option span { font-size: 11px; color: #777; }

        /* Switch Estilizado */
        .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { 
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; 
            background: #333; border-radius: 34px; transition: .3s; 
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .3s;
        }
        input:checked + .slider { background: #ff7b00; }
        input:checked + .slider:before { transform: translateX(18px); }

        .hidden { display: none !important; }

        h2 { margin-bottom: 20px; color: #ff7b00; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <img src="1000053165.jpg" class="profile-img" alt="Profile">
        <p style="color: #aaa; font-size: 14px;">Coloque a key de acesso</p>
        <input type="password" id="key-input" placeholder="Insira a key...">
        <button class="btn" onclick="checkKey()">Logar</button>
    </div>

    <div id="panel-screen" class="card hidden">
        <h2 style="font-size: 18px; letter-spacing: 1px;">PAINEL SIELZADA V3</h2>
        <div class="option">
            <div><strong>Aimbot Legit</strong><span>Melhora o alinhamento da mira.</span></div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>
        <div class="option">
            <div><strong>Reduzir Lags</strong><span>Remove os lags do jogo.</span></div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>
        <button class="btn" style="margin-top: 15px;" onclick="openFreeFire()">ABRIR FREE FIRE</button>
    </div>

    <script>
        // Função de teste para você ver a troca de telas
        function checkKey() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('panel-screen').classList.remove('hidden');
        }

        function openFreeFire() {
            alert("Abrindo o jogo...");
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    </script>
</body>
</html>
