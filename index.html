<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zs.xisFF - Painel VIP</title>
    <style>
        :root { 
            --pink: #ff00ff; 
            --bg: #0a0a0a; 
            --card: #121212; 
            --green: #00ff88; 
            --border-red: #ff0055;
        }

        body { 
            background: var(--bg); 
            color: white; 
            margin: 0;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
            touch-action: none;
            overflow: hidden;
        }

        /* --- TELA DE LOGIN --- */
        #loginScreen { 
            position: fixed; 
            inset: 0; 
            background: var(--bg); 
            z-index: 999; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .login-card { 
            width: 280px; 
            background: var(--card); 
            padding: 30px; 
            border-radius: 20px; 
            border: 1px solid var(--pink); 
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.2);
        }

        input { 
            width: 100%; 
            padding: 12px; 
            background: #1a1a1a; 
            border: 1px solid #333; 
            color: white; 
            border-radius: 8px; 
            margin: 15px 0; 
            text-align: center; 
            box-sizing: border-box; 
            outline: none;
            transition: border 0.3s;
        }

        input:focus { border-color: var(--pink); }

        /* --- PAINEL PRINCIPAL --- */
        #mainPanel { display: none; }

        .panel { 
            width: 310px; 
            background: var(--card); 
            border-radius: 15px; 
            border: 2px solid var(--border-red); 
            padding: 20px; 
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.3);
        }

        .header { 
            text-align: center; 
            margin-bottom: 25px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px;
            font-size: 1.1rem;
        }

        .status-dot { 
            width: 10px; 
            height: 10px; 
            background: #444; 
            border-radius: 50%; 
            transition: 0.3s;
        }

        .status-dot.active { 
            background: var(--green); 
            box-shadow: 0 0 12px var(--green); 
        }

        /* --- ITENS E SWITCHES --- */
        .option-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 18px; 
            padding: 0 5px;
        }

        .option-item span { font-size: 0.95rem; color: #eee; }

        .switch { position: relative; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }

        .slider { 
            position: absolute; 
            inset: 0; 
            background: #333; 
            border-radius: 34px; 
            cursor: pointer; 
            transition: .3s; 
        }

        .slider:before { 
            position: absolute; 
            content: ""; 
            height: 14px; 
            width: 14px; 
            left: 3px; 
            bottom: 3px; 
            background: white; 
            border-radius: 50%; 
            transition: .3s; 
        }

        input:checked + .slider { background: var(--pink); }
        input:checked + .slider:before { transform: translateX(14px); }

        /* --- BOTÃO INJETAR --- */
        .btn-inject { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: none; 
            background: linear-gradient(90deg, #9900ff, #ff00ff); 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-inject:active { transform: scale(0.98); }

        .btn-inject.active { 
            background: #000 !important; 
            border: 1px solid var(--green) !important; 
            color: var(--green) !important; 
            background-image: none !important; 
        }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-card">
            <h2 style="color: var(--pink); margin-bottom: 5px;">Zs.xisFF</h2>
            <p style="font-size: 0.75rem; color: #888; margin-bottom: 20px;">PAINEL DE SENSIBILIDADE VIP</p>
            <input type="text" id="keyInput" placeholder="INSIRA SUA KEY">
            <button class="btn-inject" onclick="autenticar()">ATIVAR ACESSO</button>
        </div>
    </div>

    <div id="mainPanel">
        <div class="panel">
            <div class="header">
                <div class="status-dot" id="dot"></div> 
                <span>Zs.xisFF V2.5 ONLINE</span>
            </div>
            
            <div class="option-item">
                <span>Aimbot Bézier</span> 
                <label class="switch"><input type="checkbox" id="aim"><span class="slider"></span></label>
            </div>
            
            <div class="option-item">
                <span>No Recoil (Ultra)</span> 
                <label class="switch"><input type="checkbox" id="recoil"><span class="slider"></span></label>
            </div>
            
            <div class="option-item">
                <span>Anti-Jitter 60FPS</span> 
                <label class="switch"><input type="checkbox" id="jitter" checked><span class="slider"></span></label>
            </div>

            <div class="option-item">
                <span>Auxílio de Mira (Strafe)</span> 
                <label class="switch"><input type="checkbox" id="auxilio"><span class="slider"></span></label>
            </div>

            <button class="btn-inject" id="btnInject" onclick="injetarEngine()">INJETAR ENGINE</button>
        </div>
    </div>

    <script src="painel_script.js"></script>
</body>
</html>
