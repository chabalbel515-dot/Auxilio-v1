<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <style>
        /* Ajuste para garantir que o fundo ocupe 100% da tela */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; /* Força o alinhamento no meio da tela */
            width: 100vw;
            margin: 0; 
            overflow: hidden; 
        }

        .card { 
            background: rgba(10, 10, 10, 0.95); 
            border: 1px solid #1a1a1a; 
            border-radius: 25px; 
            padding: 25px; 
            width: 90%; 
            max-width: 360px; /* Tamanho ideal para mobile */
            text-align: center; 
            box-shadow: 0 0 30px rgba(255, 123, 0, 0.1); 
        }

        .profile-img { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            border: 2px solid #ff7b00; 
            margin: 0 auto 15px auto; 
            display: block; 
        }

        input { 
            width: 100%; 
            padding: 12px; 
            background: #111; 
            border: 1px solid #333; 
            border-radius: 10px; 
            color: #fff; 
            margin: 15px 0; 
        }

        .btn { 
            width: 100%; 
            padding: 15px; 
            background: #ff7b00; 
            border: none; 
            border-radius: 12px; 
            color: #fff; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: 10px;
        }

        /* O segredo para ficar que nem a imagem 2: display flex nas opções */
        .option { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #080808; 
            padding: 12px 15px; 
            border-radius: 15px; 
            margin-bottom: 12px; /* Espaço entre cada item */
            text-align: left; 
            border: 1px solid #1a1a1a; 
        }

        .option div { flex: 1; }
        .option strong { font-size: 14px; display: block; color: #fff; }
        .option span { font-size: 11px; color: #666; }

        /* Estilo do Switch (Bolinha) */
        .switch { position: relative; width: 42px; height: 22px; flex-shrink: 0; margin-left: 10px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { 
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; 
            background: #333; border-radius: 34px; transition: .3s; 
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px;
            left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .3s;
        }
        input:checked + .slider { background: #ff7b00; }
        input:checked + .slider:before { transform: translateX(20px); }

        .hidden { display: none !important; }
        h2 { font-size: 18px; margin-bottom: 20px; color: #fff; letter-spacing: 1px; }
        .footer-text { color: #444; font-size: 12px; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <img src="1000053165.jpg" class="profile-img">
        <p>coloca a key de acesso</p>
        <input type="password" id="key-input" placeholder="insira a key...">
        <button class="btn" onclick="checkKey()">logar</button>
    </div>

    <div id="panel-screen" class="card hidden">
        <h2>PAINEL SIELZADA V3</h2>
        
        <div class="option">
            <div><strong>aimbot legit</strong><span>Melhora o alinhamento da mira.</span></div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

        <div class="option">
            <div><strong>reduzir lags</strong><span>Remove os lags do jogo.</span></div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

        <div class="option">
            <div><strong>melhorar 2x</strong><span>Melhora sua mira 2x em até 10%.</span></div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

        <div class="option">
            <div><strong>aumentar desempenho</strong><span>Otimização máxima de FPS.</span></div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

        <button class="btn" onclick="openFreeFire()">ABRIR FREE FIRE</button>
        <p class="footer-text">sielz</p>
    </div>

    <script src="engine.js"></script>
    <script>
        // Use sua lógica do engine.js, aqui é apenas o gatilho visual
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    </script>
</body>
</html>
