<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .card { background: rgba(10, 10, 10, 0.95); border: 1px solid #222; border-radius: 25px; padding: 25px; width: 320px; text-align: center; box-shadow: 0 0 30px rgba(255, 123, 0, 0.1); }
        .profile-img { width: 90px; height: 90px; border-radius: 50%; border: 2px solid #ff7b00; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; background: #111; border: 1px solid #333; border-radius: 10px; color: #fff; margin: 15px 0; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #ff7b00; border: none; border-radius: 12px; color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .option { display: flex; justify-content: space-between; align-items: center; background: #080808; padding: 12px; border-radius: 15px; margin-bottom: 10px; text-align: left; border: 1px solid #1a1a1a; }
        .option strong { font-size: 14px; display: block; }
        .option span { font-size: 11px; color: #666; }
        .switch { position: relative; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 34px; transition: .3s; }
        input:checked + .slider { background: #ff7b00; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="login-screen" class="card">
        <img src="1000053165.jpg" class="profile-img">
        <p>coloca a key de acesso</p>
        <input type="password" id="key-input" placeholder="insira a key...">
        <button class="btn" onclick="checkKey()">logar</button>
    </div>

    <div id="panel-screen" class="card hidden">
        <h2 style="font-size: 18px; letter-spacing: 1px;">PAINEL SIELZADA V3</h2>
        <div class="option">
            <div><strong>aimbot legit</strong><span>Melhora o alinhamento da mira.</span></div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>
        <div class="option">
            <div><strong>reduzir lags</strong><span>Remove os lags do jogo.</span></div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>
        <button class="btn" style="margin-top: 15px;" onclick="openFreeFire()">ABRIR FREE FIRE</button>
    </div>

    <script src="engine.js"></script>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    </script>
</body>
</html>
